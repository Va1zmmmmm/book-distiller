[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-distiller"
version = "0.1.0"
description = "Source-checked reading cards and reading-position-scoped companion materials"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
book-distiller = "book_distiller.__main__:main"

[tool.setuptools]
packages = ["book_distiller"]
